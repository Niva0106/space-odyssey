<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vessel Hologram – Space Mission Design</title>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#040a12;--cy:#5ff3ff;--am:#ffb347;--dim:#1b3a4d;--tx:#cfe9f2;color-scheme:dark}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:radial-gradient(ellipse at 40% 55%,#0a1a2b,var(--bg) 70%);color:var(--tx);font-family:Rajdhani,'Segoe UI',sans-serif;overflow:hidden}
canvas#c{position:fixed;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair}
.hud{position:fixed;pointer-events:none}
#title{top:18px;left:24px}
#title h1{font-size:26px;font-weight:700;letter-spacing:.14em;color:var(--cy);text-shadow:0 0 14px #5ff3ff88}
#title p{font-size:15px;opacity:.7}
#panel{top:18px;right:18px;width:min(340px,86vw);border:1px solid var(--cy);background:#061523cc;padding:16px;clip-path:polygon(0 0,calc(100% - 18px) 0,100% 18px,100% 100%,0 100%);box-shadow:0 0 24px #5ff3ff22 inset;transition:opacity .25s,transform .25s}
#panel.off{opacity:0;transform:translateX(24px)}
#panel h2{font-size:22px;color:var(--am);letter-spacing:.06em}
#panel .d{font-size:16px;margin:4px 0 10px;opacity:.85}
.row{display:flex;justify-content:space-between;border-bottom:1px solid var(--dim);padding:4px 0;font-size:16px}
.row b{color:var(--cy);font-weight:600}
#gl{font-size:14px;margin:12px 0 2px;opacity:.7}
#gr{width:100%;height:90px;display:block;border:1px solid var(--dim)}
#chips{bottom:18px;left:24px;display:flex;gap:8px;flex-wrap:wrap;pointer-events:auto;max-width:60vw}
#chips button{font:600 15px Rajdhani,sans-serif;color:var(--cy);background:#061523cc;border:1px solid var(--dim);padding:6px 12px;cursor:pointer}
#chips button:hover,#chips button:focus-visible,#chips button.on{border-color:var(--am);color:var(--am);outline:none}
#cam{bottom:18px;right:18px;width:200px;text-align:right;pointer-events:auto}
#pv{width:200px;height:150px;border:1px solid var(--dim);display:none;background:#000}
#st{font-size:14px;margin:6px 0;opacity:.8}
#go{font:700 16px Rajdhani,sans-serif;color:#041018;background:var(--cy);border:0;padding:9px 14px;cursor:pointer}
#help{bottom:70px;left:24px;font-size:15px;opacity:.7;max-width:420px}
video{display:none}
@media(prefers-reduced-motion:reduce){#panel{transition:none}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hud" id="title"><h1>VESSEL HOLOGRAM</h1><p>Pinch a glowing part to inspect it. Pinch empty space and move to rotate.</p></div>
<div class="hud off" id="panel"><h2 id="pn"></h2><div class="d" id="pd"></div><div id="ps"></div><div id="gl"></div><canvas id="gr" width="340" height="90"></canvas></div>
<div class="hud" id="chips"></div>
<div class="hud" id="help">Two hands: spread or close your index fingers to zoom. No camera? Drag and click with the mouse.</div>
<div class="hud" id="cam"><canvas id="pv" width="200" height="150"></canvas><div id="st">Camera off</div><button id="go">Enable hand tracking</button></div>
<video id="vid" playsinline></video>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/hands.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils@0.3.1675466862/camera_utils.js"></script>
<script>
// ---------- ship model (edit specs here) ----------
const ring=(x,r,n,oy=0,oz=0)=>Array.from({length:n},(_,i)=>{const t=i/n*6.283;return[x,oy+Math.cos(t)*r,oz+Math.sin(t)*r]});
const tube=R=>{const s=[];R.forEach((q,k)=>q.forEach((p,i)=>{s.push([p,q[(i+1)%q.length]]);if(k<R.length-1)s.push([p,R[k+1][i]])}));return s};
const lerp=(a,b,t)=>a.map((v,i)=>v+(b[i]-v)*t);
let wings=[];[-1,1].forEach(s=>{const A=[1.5,0,1.2*s],B=[-3.5,0,1.2*s],C=[-3.5,0,5.5*s],D=[-1.5,0,4*s];wings.push([A,B],[B,C],[C,D],[D,A]);[.25,.5,.75].forEach(t=>wings.push([lerp(A,B,t),lerp(D,C,t)]))});
let dish=[];for(let i=0;i<14;i++){const a=i/14*6.283,b=(i+1)/14*6.283;dish.push([[-1+Math.cos(a)*.9,2,Math.sin(a)*.9],[-1+Math.cos(b)*.9,2,Math.sin(b)*.9]],[[-1,2,0],[-1+Math.cos(a)*.9,2,Math.sin(a)*.9]])}dish.push([[-1,1.2,0],[-1,2,0]]);
let eng=[];[-1.1,1.1].forEach(z=>eng=eng.concat(tube([ring(-4,.55,8,-.2,z),ring(-5.6,.7,8,-.2,z),ring(-6.2,.45,8,-.2,z)])));
const PARTS=[
{id:'cockpit',name:'Crew Module',desc:'Pressurised flight deck and crew quarters.',segs:tube([ring(3,1.2,8),ring(4.5,.8,8),ring(6,.15,8)]),anchor:[5,.5,0],specs:{Crew:'4',Pressure:'101 kPa',Endurance:'30 days'},gl:'Cabin oxygen (%)',base:21,amp:.4},
{id:'hull',name:'Main Hull',desc:'Load-bearing structure holding every system together.',segs:tube([ring(-4,1.2,8),ring(-1,1.2,8),ring(3,1.2,8)]),anchor:[1.2,1.3,0],specs:{Material:'Ti-Al alloy',Mass:'12.4 t',Length:'12 m'},gl:'Hull stress (MPa)',base:140,amp:18},
{id:'fuel',name:'Propellant Tank',desc:'Stores the fuel and oxidiser for the main burn.',segs:tube([ring(-3,1.55,10),ring(-1.5,1.7,10),ring(0,1.55,10)]),anchor:[-1.5,-1.7,0],specs:{Capacity:'8,200 kg',Type:'LOX / CH4',Fill:'87%'},gl:'Tank pressure (bar)',base:3.2,amp:.3},
{id:'engines',name:'Main Thrusters',desc:'Twin engines that push the vessel through space.',segs:eng,anchor:[-5.6,-.2,0],specs:{Thrust:'2 × 420 kN',Isp:'358 s',Burn:'540 s'},gl:'Thrust output (kN)',base:840,amp:60},
{id:'wings',name:'Solar Arrays',desc:'Folding panels that turn sunlight into power.',segs:wings,anchor:[-2.2,0,4.4],specs:{Output:'18 kW',Area:'64 m²',Efficiency:'29%'},gl:'Power generation (kW)',base:18,amp:2.5},
{id:'dish',name:'Comms Dish',desc:'High-gain antenna linking the crew to Earth.',segs:dish,anchor:[-1,2,0],specs:{Band:'X / Ka',Rate:'120 Mbps',Range:'384,000 km'},gl:'Signal strength (dBm)',base:-82,amp:3}
];

// ---------- canvas + projection ----------
const cv=document.getElementById('c'),g=cv.getContext('2d');let W,H;
function rs(){const d=devicePixelRatio||1;W=innerWidth;H=innerHeight;cv.width=W*d;cv.height=H*d;g.setTransform(d,0,0,d,0,0)}addEventListener('resize',rs);rs();
let yaw=-.7,pitch=.32,zoom=1,sel=null,hov=null,idle=performance.now();
function proj(p){let[x,y,z]=p,c=Math.cos(yaw),s=Math.sin(yaw);const x1=x*c+z*s,z1=-x*s+z*c;c=Math.cos(pitch);s=Math.sin(pitch);const y1=y*c-z1*s,z2=y*s+z1*c,f=1/(1+z2*.04),k=Math.min(W*.5,H*.9)/16*zoom;return[W*.4+x1*k*f,H*.54-y1*k*f]}
function line(a,b){const p=proj(a),q=proj(b);g.moveTo(p[0],p[1]);g.lineTo(q[0],q[1])}

// ---------- input (hand or mouse) ----------
const inp={x:-99,y:-99,down:false,prev:false},drag={on:false,x:0,y:0};let handSeen=0;
cv.addEventListener('pointermove',e=>{if(performance.now()-handSeen<400)return;inp.x=e.clientX;inp.y=e.clientY});
cv.addEventListener('pointerdown',e=>{if(performance.now()-handSeen<400)return;inp.x=e.clientX;inp.y=e.clientY;inp.down=true});
addEventListener('pointerup',()=>{if(performance.now()-handSeen>=400)inp.down=false});
function pick(id){sel=PARTS.find(p=>p.id===id)||null;const pn=document.getElementById('panel');pn.classList.toggle('off',!sel);document.querySelectorAll('#chips button').forEach(b=>b.classList.toggle('on',sel&&b.dataset.id===sel.id));
if(!sel)return;document.getElementById('pn').textContent=sel.name;document.getElementById('pd').textContent=sel.desc;
document.getElementById('ps').innerHTML=Object.entries(sel.specs).map(([k,v])=>`<div class="row"><span>${k}</span><b>${v}</b></div>`).join('');document.getElementById('gl').textContent=sel.gl}
const chips=document.getElementById('chips');PARTS.forEach(p=>{const b=document.createElement('button');b.textContent=p.name;b.dataset.id=p.id;b.onclick=()=>pick(p.id);chips.appendChild(b)});

// ---------- hand tracking ----------
const pv=document.getElementById('pv'),pg=pv.getContext('2d'),vid=document.getElementById('vid'),st=document.getElementById('st');
let pinching=false,lastSpread=0;
function onHands(r){pg.save();pg.scale(-1,1);pg.drawImage(r.image,-200,0,200,150);pg.restore();
const L=r.multiHandLandmarks||[];if(!L.length){lastSpread=0;return}
handSeen=performance.now();const h=L[0],d=Math.hypot(h[4].x-h[8].x,h[4].y-h[8].y);
pinching=pinching?d<.08:d<.05;
inp.x+=((1-h[8].x)*W-inp.x)*.5;inp.y+=(h[8].y*H-inp.y)*.5;if(inp.x<0)inp.x=(1-h[8].x)*W;inp.down=pinching;
if(L.length>1){const s=Math.hypot(L[0][8].x-L[1][8].x,L[0][8].y-L[1][8].y);if(lastSpread)zoom=Math.max(.5,Math.min(2.2,zoom*(s/lastSpread)));lastSpread=s}else lastSpread=0;
pg.fillStyle='#5ff3ff';L.forEach(m=>m.forEach(p=>{pg.fillRect((1-p.x)*200-1,p.y*150-1,3,3)}))}
document.getElementById('go').onclick=async()=>{
if(!window.Hands){st.textContent='Tracking library blocked. Check your connection.';return}
try{const hands=new Hands({locateFile:f=>`https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/${f}`});
hands.setOptions({maxNumHands:2,modelComplexity:1,minDetectionConfidence:.6,minTrackingConfidence:.5});hands.onResults(onHands);
st.textContent='Starting camera…';const cam=new Camera(vid,{onFrame:async()=>{await hands.send({image:vid})},width:640,height:480});await cam.start();
pv.style.display='block';st.textContent='Hand tracking on';document.getElementById('go').style.display='none'}
catch(e){st.textContent='Camera unavailable. Allow access or use the mouse.'}};

// ---------- graph ----------
const gr=document.getElementById('gr'),gx=gr.getContext('2d');
function graph(t){gx.clearRect(0,0,340,90);if(!sel)return;gx.strokeStyle='#1b3a4d';gx.lineWidth=1;for(let i=1;i<4;i++){gx.beginPath();gx.moveTo(0,i*22.5);gx.lineTo(340,i*22.5);gx.stroke()}
gx.strokeStyle='#5ff3ff';gx.lineWidth=2;gx.beginPath();for(let x=0;x<=340;x+=4){const v=Math.sin((x*.045)+t*2.2)*.6+Math.sin(x*.13-t*3.1)*.4;const y=45-v*32;x?gx.lineTo(x,y):gx.moveTo(x,y)}gx.stroke();
const cur=sel.base+Math.sin(t*2.2)*sel.amp*.6;gx.fillStyle='#ffb347';gx.font='600 14px Rajdhani,sans-serif';gx.fillText(cur.toFixed(1),6,16)}

// ---------- main loop ----------
let prevX=0,prevY=0;
function frame(now){const t=now/1000;g.clearRect(0,0,W,H);
// interaction
const pressed=inp.down&&!inp.prev;hov=null;let best=46;
PARTS.forEach(p=>{const a=proj(p.anchor),d=Math.hypot(a[0]-inp.x,a[1]-inp.y);if(d<best){best=d;hov=p}});
if(pressed){if(hov)pick(hov.id);else{drag.on=true;drag.x=inp.x;drag.y=inp.y}}
if(!inp.down)drag.on=false;
if(drag.on){yaw+=(inp.x-drag.x)*.008;pitch=Math.max(-1.2,Math.min(1.2,pitch+(inp.y-drag.y)*.008));drag.x=inp.x;drag.y=inp.y;idle=now}
inp.prev=inp.down;if(now-idle>3000)yaw+=.0025;
// floor rings
g.lineWidth=1;g.strokeStyle='#1b3a4d';[4,7,10].forEach(r=>{g.beginPath();for(let i=0;i<=64;i++){const a=i/64*6.283,p=proj([Math.cos(a)*r,-2.6,Math.sin(a)*r]);i?g.lineTo(p[0],p[1]):g.moveTo(p[0],p[1])}g.stroke()});
g.beginPath();for(let i=0;i<12;i++){const a=i/12*6.283;line([Math.cos(a)*4,-2.6,Math.sin(a)*4],[Math.cos(a)*10,-2.6,Math.sin(a)*10])}g.stroke();
// parts
g.lineJoin='round';PARTS.forEach(p=>{const on=sel===p||hov===p;g.beginPath();p.segs.forEach(s=>line(s[0],s[1]));g.strokeStyle=on?'#ffb347':'#5ff3ff';g.globalAlpha=on?1:.55;g.lineWidth=on?2:1.2;g.shadowColor=on?'#ffb347':'#5ff3ff';g.shadowBlur=on?16:8;g.stroke()});
g.globalAlpha=1;g.shadowBlur=0;
// scan plane
const sx=Math.sin(t*.9)*6;g.beginPath();for(let i=0;i<=40;i++){const a=i/40*6.283,p=proj([sx,Math.cos(a)*2.4,Math.sin(a)*2.4]);i?g.lineTo(p[0],p[1]):g.moveTo(p[0],p[1])}g.strokeStyle='#5ff3ff55';g.lineWidth=1;g.stroke();
// hotspots
g.font='600 15px Rajdhani,sans-serif';PARTS.forEach(p=>{const a=proj(p.anchor),on=sel===p||hov===p;g.beginPath();g.arc(a[0],a[1],on?9:6,0,6.283);g.strokeStyle=on?'#ffb347':'#5ff3ff';g.lineWidth=2;g.stroke();
if(on){g.beginPath();g.moveTo(a[0]+9,a[1]);g.lineTo(a[0]+40,a[1]-26);g.lineTo(a[0]+60,a[1]-26);g.stroke();g.fillStyle='#ffb347';g.fillText(p.name,a[0]+44,a[1]-32)}});
// cursor
if(inp.x>-50){g.beginPath();g.arc(inp.x,inp.y,inp.down?7:13,0,6.283);g.strokeStyle=inp.down?'#ffb347':'#ffffff';g.lineWidth=2;g.stroke()}
graph(t);requestAnimationFrame(frame)}
requestAnimationFrame(frame);
</script>
</body>
</html>
