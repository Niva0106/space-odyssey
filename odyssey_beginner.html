<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Space Odyssey – Beginner Space Academy</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #050b18;
        --pn: rgba(9, 22, 46, 0.8);
        --pn2: #10264a;
        --ln: #1d3a66;
        --cy: #35d0ff;
        --tx: #eef5ff;
        --mu: #93aacb;
        --or: #ff9a2e;
        --ye: #ffd24a;
        --gr: #3ddc84;
        --rd: #ff5252;
        box-sizing: border-box;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
      html {
        scroll-padding-top: env(safe-area-inset-top, 0px);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: #030814;
        color: var(--tx);
        font:
          16px/1.5 "Segoe UI",
          system-ui,
          sans-serif;
      }
      header {
        display: flex;
        gap: 10px;
        align-items: center;
        flex-wrap: wrap;
        padding: 10px 16px;
        border-bottom: 1px solid var(--ln);
        background: #071226cc;
        position: sticky;
        top: env(safe-area-inset-top, 0px);
        z-index: 5;
        backdrop-filter: blur(6px);
      }
      header b {
        letter-spacing: 0.14em;
        color: var(--cy);
        margin-right: auto;
      }
      button,
      .btn {
        background: var(--pn2);
        color: var(--tx);
        border: 1px solid var(--ln);
        border-radius: 8px;
        padding: 9px 14px;
        font: inherit;
        cursor: pointer;
      }
      button:hover {
        border-color: var(--cy);
      }
      button:focus-visible,
      input:focus-visible,
      select:focus-visible {
        outline: 2px solid var(--ye);
        outline-offset: 2px;
      }
      button.p {
        background: linear-gradient(#ffb13d, var(--or));
        color: #1a0f00;
        border: 0;
        font-weight: 700;
      }
      button.big {
        font-size: 1.15rem;
        padding: 14px 26px;
      }
      button.on {
        border-color: var(--cy);
        background: #0f3a63;
      }
      button:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }
      main {
        max-width: 1280px;
        margin: 0 auto;
        padding: 18px 16px 50px;
      }
      h1 {
        font-size: clamp(2rem, 5vw, 3.4rem);
        line-height: 1.05;
        margin: 0.2em 0;
      }
      h2 {
        margin: 0.2em 0 0.5em;
      }
      h3 {
        margin: 0.6em 0 0.2em;
        color: var(--cy);
        font-size: 1rem;
      }
      .pn {
        background: var(--pn);
        border: 1px solid var(--ln);
        border-radius: 10px;
        padding: 14px;
      }
      .mu {
        color: var(--mu);
      }
      .row {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        align-items: center;
      }
      .hero {
        display: grid;
        grid-template-columns: 1.3fr 1fr;
        gap: 20px;
        align-items: center;
        min-height: 70vh;
      }
      .grid5 {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
        gap: 14px;
      }
      .card {
        background: var(--pn);
        border: 1px solid var(--ln);
        border-radius: 10px;
        overflow: hidden;
        display: flex;
        flex-direction: column;
      }
      .card canvas,
      .card .ph {
        width: 100%;
        height: 150px;
        display: block;
        background: #020610;
      }
      .ph {
        display: grid;
        place-items: center;
        color: var(--mu);
      }
      .card div.b {
        padding: 12px;
        display: flex;
        flex-direction: column;
        gap: 6px;
        flex: 1;
      }
      .card ul {
        margin: 0;
        padding-left: 18px;
        font-size: 0.88rem;
        color: var(--mu);
      }
      .bar {
        height: 8px;
        background: #06101f;
        border-radius: 6px;
        overflow: hidden;
      }
      .bar i {
        display: block;
        height: 100%;
        background: linear-gradient(90deg, var(--cy), var(--gr));
      }
      .bd {
        display: inline-block;
        padding: 4px 10px;
        border-radius: 20px;
        border: 1px solid var(--ln);
        font-size: 0.85rem;
        margin: 3px;
      }
      .bd.g {
        border-color: var(--ye);
        color: var(--ye);
      }
      .bg2 {
        display: grid;
        grid-template-columns: 230px minmax(0, 1fr) 310px;
        gap: 12px;
      }
      @media (max-width: 1000px) {
        .bg2,
        .hero {
          grid-template-columns: 1fr;
        }
        .hero {
          min-height: 0;
        }
      }
      .li {
        display: flex;
        justify-content: space-between;
        gap: 6px;
        width: 100%;
        text-align: left;
        margin: 0 0 5px;
        padding: 8px 10px;
      }
      .li.ok {
        border-color: var(--gr);
      }
      .li.sel {
        background: #0f3a63;
        border-color: var(--cy);
      }
      canvas.m {
        width: 100%;
        max-width: 100%;
        background: #020610;
        border: 1px solid var(--ln);
        border-radius: 10px;
        touch-action: none;
      }
      .ok {
        color: var(--gr);
      }
      .bad {
        color: var(--rd);
      }
      .wr {
        color: var(--or);
      }
      .fact {
        border-left: 3px solid var(--ye);
        padding-left: 10px;
        color: #ffe9a8;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 0.88rem;
      }
      td {
        padding: 2px 0;
      }
      td:last-child {
        text-align: right;
      }
      .ov {
        position: fixed;
        inset: 0;
        background: #000a;
        display: grid;
        place-items: center;
        z-index: 20;
        padding: 12px;
      }
      .ov[hidden] {
        display: none;
      }
      .dl {
        font-size: 1.15rem;
        background: #0b1a33;
        border: 1px solid var(--cy);
        border-radius: 14px;
        max-width: 780px;
        width: 100%;
        max-height: 90vh;
        overflow: auto;
        padding: 18px;
      }
      .big-t {
        font-size: 3rem;
        text-align: center;
        color: var(--ye);
        font-weight: 700;
        min-height: 1.3em;
      }
      .tel {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
        gap: 8px;
        margin: 10px 0;
      }
      .tel div {
        background: #06101f;
        border: 1px solid var(--ln);
        border-radius: 8px;
        padding: 6px 10px;
      }
      .tel b {
        display: block;
        font-size: 1.2rem;
        color: var(--cy);
      }
      input[type="range"] {
        width: 100%;
      }
      input,
      select {
        background: #06101f;
        color: var(--tx);
        border: 1px solid var(--ln);
        border-radius: 8px;
        padding: 8px;
        font: inherit;
      }
      .tst {
        position: fixed;
        bottom: 16px;
        left: 50%;
        transform: translateX(-50%);
        background: #14391f;
        border: 1px solid var(--gr);
        padding: 10px 18px;
        border-radius: 10px;
        z-index: 30;
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          scroll-behavior: auto !important;
        }
      }
      #msg {
        font-size: 1.05rem;
      }
      .dl h2 {
        font-size: 1.9rem;
      }
      .dl button {
        font-size: 1.1rem;
        padding: 12px 20px;
      }
      .pn,
      .card {
        backdrop-filter: blur(5px);
      }
      .stt {
        padding: 5px 14px;
        border-radius: 20px;
        color: #021;
        font-weight: 700;
        background: #35d0ff;
      }
      .mt {
        position: relative;
        height: 12px;
        border-radius: 8px;
        margin: 8px 0;
        background: linear-gradient(
          90deg,
          #ff5252 0 43%,
          #ff9a2e 43% 58%,
          #3ddc84 58% 67%,
          #ffd24a 67% 88%,
          #35d0ff 88%
        );
      }
      .mt i {
        position: absolute;
        top: -4px;
        width: 6px;
        height: 20px;
        background: #fff;
        border-radius: 3px;
        left: 0;
      }
      .cdn {
        font-size: 9rem;
        font-weight: 800;
        color: #ffd24a;
        text-shadow: 0 0 40px #ff9a2e;
        animation: pop 0.7s ease-out;
      }
      @keyframes pop {
        from {
          transform: scale(2.4);
          opacity: 0;
        }
        to {
          transform: scale(1);
          opacity: 1;
        }
      }
      .wn {
        animation: pop 0.6s ease-out;
        box-shadow: 0 0 80px #ffd24a66;
      }
      .rk {
        display: inline-block;
        animation: fly 2.2s ease-in-out infinite;
      }
      @keyframes fly {
        0%,
        100% {
          transform: translateY(8px) rotate(-8deg);
        }
        50% {
          transform: translateY(-14px) rotate(8deg);
        }
      }
      .stars {
        font-size: 3rem;
        color: #ffd24a;
        letter-spacing: 8px;
        animation: pop 1s ease-out;
      }
      .pad button {
        width: 64px;
        height: 54px;
        font-size: 1.3rem;
        touch-action: none;
      }
      .ob p {
        margin: 3px 0;
      }
    </style>
  </head>
  <body>
    <header>
      <b>SPACE ODYSSEY · BEGINNER ACADEMY</b
      ><button id="hL" onclick="window.location.href='index.html#levels'">
        ← Levels</button
      ><button id="hH">Academy home</button
      ><button id="hA">Ask the Scientist</button
      ><button id="hS">Sound: on</button>
    </header>
    <main id="v"></main>
    <div class="ov" id="ov" hidden>
      <div class="dl" id="dl" role="dialog" aria-live="polite"></div>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
      const $ = (q) => document.querySelector(q),
        INR_PER_USD = 95,
        fm = (n) => "$" + Math.round(n / INR_PER_USD).toLocaleString("en-US");
      let S;
      try {
        S = JSON.parse(localStorage.getItem("soBeg"));
      } catch (e) {}
      S = Object.assign(
        {
          nick: "",
          age: 1,
          diff: 1,
          entered: 0,
          asm: 0,
          launched: 0,
          orb: {},
          asks: 0,
          qok: 0,
          qn: 0,
          b: {},
          mute: 0,
        },
        S || {},
      );
      const save = () => {
        try {
          localStorage.setItem("soBeg", JSON.stringify(S));
        } catch (e) {}
      };
      const pk = (a) => (Array.isArray(a) ? a[S.age === 0 ? 0 : 1] : a);
      const AGES = [
          "Young Explorers (6–9)",
          "Junior Scientists (10–13)",
          "Future Engineers (14–17)",
        ],
        DIFF = ["Relaxed", "Standard", "Challenging"],
        BUD = [1200000, 1000000, 900000];
      const BD = {
        rocket: ["Junior Rocket Engineer", "Complete the rocket assembly"],
        launch: ["First Successful Launch", "Launch and deploy a payload"],
        orbit: ["Orbit Master", "Finish all 4 orbit challenges"],
        astro: ["Young Astronomer", "Ask the Scientist 3 questions"],
        sat: ["Satellite Scientist", "Build and deploy a satellite"],
        dock: ["Asteroid Defender", "Clear the asteroid field and protect Earth"],
        rover: [
          "Jet-Pack Rescue Commander",
          "Rescue stranded astronauts & touch down safely on the landing pad",
        ],
      };
      function award(k) {
        if (S.b[k]) return;
        S.b[k] = 1;
        save();
        const t = document.createElement("div");
        t.className = "tst";
        t.textContent = "🏅 Achievement unlocked: " + BD[k][0];
        document.body.append(t);
        setTimeout(() => t.remove(), 3500);
      }
      /* ---------- audio ---------- */
      let AC, NZ;
      function snd(t) {
        if (S.mute) return;
        try {
          AC = AC || new AudioContext();
          if (t === "b") {
            const o = AC.createOscillator(),
              g = AC.createGain();
            o.frequency.value = 660;
            g.gain.value = 0.05;
            o.connect(g).connect(AC.destination);
            o.start();
            o.stop(AC.currentTime + 0.12);
          }
          if (t === "r") {
            const b = AC.createBuffer(1, AC.sampleRate * 2, AC.sampleRate),
              d = b.getChannelData(0);
            for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
            NZ = AC.createBufferSource();
            NZ.buffer = b;
            NZ.loop = true;
            const f = AC.createBiquadFilter();
            f.frequency.value = 260;
            const g = AC.createGain();
            g.gain.value = 0.4;
            NZ.connect(f).connect(g).connect(AC.destination);
            NZ.start();
          }
          if (t === "x" && NZ) {
            NZ.stop();
            NZ = null;
          }
        } catch (e) {}
      }
      function say(t) {
        if (S.mute || !window.speechSynthesis) return;
        speechSynthesis.cancel();
        speechSynthesis.speak(new SpeechSynthesisUtterance(t));
      }
      /* background music: synthesised loop, no external file; mute silences it */
      let BGG = null,
        BGT = null,
        BGI = 0;
      const BGN = [
        261.6, 329.6, 392, 523.3, 440, 392, 329.6, 293.7, 261.6, 329.6, 392,
        523.3, 587.3, 523.3, 440, 392,
      ];
      function bgmStart() {
        try {
          AC = AC || new AudioContext();
          if (AC.state === "suspended") AC.resume();
          if (BGT) return;
          BGG = AC.createGain();
          BGG.gain.value = S.mute ? 0 : 0.07;
          BGG.connect(AC.destination);
          const p = AC.createOscillator(),
            pf = AC.createBiquadFilter(),
            pg = AC.createGain();
          p.type = "sawtooth";
          p.frequency.value = 130.8;
          pf.type = "lowpass";
          pf.frequency.value = 380;
          pg.gain.value = 0.22;
          p.connect(pf).connect(pg).connect(BGG);
          p.start();
          BGT = setInterval(() => {
            if (!AC) return;
            if (AC.state !== "running") {
              AC.resume && AC.resume().catch(() => {});
              return;
            }
            const t = AC.currentTime + 0.02,
              o = AC.createOscillator(),
              g = AC.createGain();
            o.type = "triangle";
            o.frequency.value = BGN[BGI++ % BGN.length];
            g.gain.setValueAtTime(0.0001, t);
            g.gain.exponentialRampToValueAtTime(0.5, t + 0.03);
            g.gain.exponentialRampToValueAtTime(0.001, t + 0.34);
            o.connect(g).connect(BGG);
            o.start(t);
            o.stop(t + 0.36);
          }, 300);
        } catch (e) {}
      }
      function bgmSync() {
        if (BGG && AC)
          BGG.gain.setTargetAtTime(S.mute ? 0 : 0.07, AC.currentTime, 0.05);
      }
      /* keep audio alive: browsers suspend audio contexts, so wake them on any interaction */
      const wakeAudio = () => {
        if (AC && AC.state !== "running") AC.resume().catch(() => {});
      };
      ["pointerdown", "keydown", "touchstart", "click"].forEach((ev) =>
        document.addEventListener(ev, wakeAudio, { passive: true }),
      );
      document.addEventListener("visibilitychange", () => {
        if (!document.hidden) wakeAudio();
      });
      setInterval(() => {
        if (!S.mute) wakeAudio();
      }, 3000);
      /* dramatic launch effects */
      function nz(n, d, v, f1, f2) {
        const b = AC.createBuffer(1, AC.sampleRate * d, AC.sampleRate),
          c = b.getChannelData(0);
        for (let i = 0; i < c.length; i++) c[i] = Math.random() * 2 - 1;
        const s = AC.createBufferSource(),
          f = AC.createBiquadFilter(),
          g = AC.createGain();
        s.buffer = b;
        f.type = "bandpass";
        f.frequency.setValueAtTime(f1, n);
        if (f2) f.frequency.exponentialRampToValueAtTime(f2, n + d * 0.85);
        g.gain.setValueAtTime(0.0001, n);
        g.gain.exponentialRampToValueAtTime(v, n + Math.min(0.8, d * 0.3));
        g.gain.exponentialRampToValueAtTime(0.001, n + d);
        s.connect(f).connect(g).connect(AC.destination);
        s.start(n);
        s.stop(n + d);
      }
      function sfx(t) {
        if (S.mute) return;
        try {
          AC = AC || new AudioContext();
          const n = AC.currentTime;
          if (t === "tk") {
            const o = AC.createOscillator(),
              g = AC.createGain();
            o.type = "square";
            o.frequency.setValueAtTime(900, n);
            o.frequency.exponentialRampToValueAtTime(1400, n + 0.1);
            g.gain.setValueAtTime(0.12, n);
            g.gain.exponentialRampToValueAtTime(0.001, n + 0.18);
            o.connect(g).connect(AC.destination);
            o.start(n);
            o.stop(n + 0.2);
          } else if (t === "bm") {
            const o = AC.createOscillator(),
              g = AC.createGain();
            o.type = "sine";
            o.frequency.setValueAtTime(120, n);
            o.frequency.exponentialRampToValueAtTime(28, n + 1.4);
            g.gain.setValueAtTime(0.9, n);
            g.gain.exponentialRampToValueAtTime(0.001, n + 1.6);
            o.connect(g).connect(AC.destination);
            o.start(n);
            o.stop(n + 1.7);
            nz(n, 1.3, 0.5, 500);
          } else if (t === "sw") {
            nz(n, 3, 0.8, 300, 3000);
          }
        } catch (e) {}
      }
      function sp(t) {
        if (S.mute || !window.speechSynthesis) return;
        const u = new SpeechSynthesisUtterance(t);
        u.rate = 0.95;
        u.pitch = 1.1;
        speechSynthesis.cancel();
        speechSynthesis.speak(u);
      }
      /* full-screen 10-to-1 countdown read aloud, then ignition and liftoff */
      function liftCount() {
        clearInterval(CD);
        document.querySelectorAll(".lo").forEach((x) => x.remove());
        const o = document.createElement("div");
        o.className = "ov lo";
        o.style.cssText =
          "position:fixed;inset:0;display:grid;place-items:start center;padding-top:12vh;pointer-events:none;z-index:26;background:none";
        document.body.append(o);
        const sh = (h, c, sz) => {
          o.innerHTML = `<div class="cdn" style="color:${c};font-size:${sz};text-shadow:0 0 40px ${c}">${h}</div>`;
        };
        let n = 10;
        sh(n, "#ffd24a", "12rem");
        $("#cd").textContent = "T-10";
        sfx("tk");
        sp("10");
        CD = setInterval(() => {
          n--;
          if (n > 0) {
            sh(n, "#ffd24a", "12rem");
            $("#cd").textContent = "T-" + n;
            sfx("tk");
            sp(String(n));
            if (F && n <= 3) F.fl = 0.2;
          } else if (n === 0) {
            sh("IGNITION", "#ff9a2e", "6rem");
            $("#cd").textContent = "IGNITION";
            if (F) F.ign = 1;
            sfx("bm");
            snd("r");
            sp("Ignition");
          } else {
            clearInterval(CD);
            sh("LIFTOFF!", "#3ddc84", "6rem");
            $("#cd").textContent = "LIFTOFF!";
            if (F) F.live = 1;
            sfx("sw");
            sp("Liftoff!");
            if ($("#ps")) $("#ps").disabled = false;
            setTimeout(() => o.remove(), 1800);
          }
        }, 1000);
      }
      /* microphone: asked once, when the player enters the academy */
      let MICP = null,
        MICSTREAM = null;
      async function micCheck() {
        if (MICSTREAM && MICSTREAM.active) return true;
        try {
          if (navigator.permissions) {
            const p = await navigator.permissions.query({ name: "microphone" });
            if (p.state === "granted") {
              S.micOk = 1;
              save();
              return true;
            }
          }
        } catch (e) {}
        try {
          MICSTREAM = await navigator.mediaDevices.getUserMedia({
            audio: {
              echoCancellation: true,
              noiseSuppression: true,
              autoGainControl: true,
            },
          });
          S.micOk = 1;
          save();
          return true;
        } catch (e) {
          window.MICERR = e.name + (e.message ? ": " + e.message : "");
          S.micOk = 0;
          save();
          return false;
        }
      }
      function askMicOnce() {
        if (MICP) return MICP;
        if (S.micAsk) return (MICP = Promise.resolve(!!S.micOk));
        S.micAsk = 1;
        save();
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia)
          return (MICP = Promise.resolve(false));
        return (MICP = navigator.mediaDevices
          .getUserMedia({
            audio: {
              echoCancellation: true,
              noiseSuppression: true,
              autoGainControl: true,
            },
          })
          .then((s) => {
            MICSTREAM = s;
            S.micOk = 1;
            save();
            return true;
          })
          .catch(() => {
            S.micOk = 0;
            save();
            return false;
          }));
      }
      /* ---------- data ---------- */
      const Z = [
        { n: "Nose section", a: 0, b: 80 },
        { n: "Payload bay", a: 80, b: 190 },
        { n: "Avionics bay", a: 190, b: 250 },
        { n: "Tank section", a: 250, b: 380 },
        { n: "Engine section", a: 380, b: 450 },
      ];
      // id,name,zone,cost(k INR),kg,cat,simple,deeper,fact,where
      const C = [
        [
          "nose",
          "Nose cone",
          0,
          40,
          120,
          "Structure",
          "The pointed tip. It slices through air and protects the rocket.",
          "A smooth pointed (ogive) shape reduces aerodynamic drag, the air resistance that wastes energy at high speed, and shields what is behind it.",
          "Engineers test nose shapes in wind tunnels.",
          "On the very top, in front of the payload fairing.",
        ],
        [
          "payload",
          "Payload",
          1,
          120,
          300,
          "Payload",
          "The cargo: a satellite or science instruments. It is the reason for the mission.",
          "Designers work backwards from payload mass to decide how big the tanks and engines must be. Only a few percent of lift-off mass is payload.",
          "Most of a rocket at lift-off is propellant.",
          "Inside the payload bay, wrapped by the fairing.",
        ],
        [
          "fairing",
          "Payload fairing",
          1,
          60,
          250,
          "Structure",

          c.fillStyle = "#15110f";
          c.fillRect(0, 132, 300, 18);
          for (let i = 0; i < 7; i++) {
            c.fillStyle = "rgba(255,255,255," + (0.25 - 0.03 * i) + ")";
            c.beginPath();
            c.arc(
              150 + Math.sin(i * 2 + t * 2) * (14 + i * 6),
              132 - ((t * 30 + i * 9) % 22),
              10 + i * 2,
              0,
              7,
            );
            c.fill();
          }
          drawR(c, 150, 6 + Math.sin(t * 4), 0.27, {
            inst: ALL,
            mode: "ext",
            flame: 0.9,
          });
        },
        orbit: (c, t) => {
          sky(c, "#14052e", "#4a1280", t);
          earth(c, 150, 92, 46);
          c.setLineDash([5, 5]);
          c.strokeStyle = "#ffd24a";
          c.lineWidth = 1.5;
          c.beginPath();
          c.ellipse(150, 92, 118, 62, -0.3, 0, 7);
          c.stroke();
          c.setLineDash([]);
          const a = t * 1.3,
            x =
              150 +
              118 * Math.cos(a) * Math.cos(-0.3) -
              62 * Math.sin(a) * Math.sin(-0.3),
            y =
              92 +
              118 * Math.cos(a) * Math.sin(-0.3) +
              62 * Math.sin(a) * Math.cos(-0.3);
          c.fillStyle = "#fff";
          c.fillRect(x - 4, y - 3, 8, 6);
          c.fillStyle = "#35d0ff";
          c.fillRect(x - 10, y - 1, 6, 2);
          c.fillRect(x + 4, y - 1, 6, 2);
          c.fillStyle = "#ff9a2e";
          c.fillRect(150 - 4, 45, 8, 3);
        },
        sat: (c, t) => {
          sky(c, "#032a33", "#0d7a8a", t);
          earth(c, 150, 260, 150);
          const w = 14 + 34 * Math.abs(Math.sin(t * 0.8)),
            x = 150,
            y = 62;
          c.fillStyle = "#2e6fd6";
          c.fillRect(x - 18 - w, y - 10, w, 20);
          c.fillRect(x + 18, y - 10, w, 20);
          c.strokeStyle = "#1d3a66";
          for (let i = 1; i < 4; i++) {
            c.beginPath();
            c.moveTo(x + 18 + (w * i) / 4, y - 10);
            c.lineTo(x + 18 + (w * i) / 4, y + 10);
            c.moveTo(x - 18 - (w * i) / 4, y - 10);
            c.lineTo(x - 18 - (w * i) / 4, y + 10);
            c.stroke();
          }
          c.fillStyle = "#d9b24a";
          c.fillRect(x - 18, y - 22, 36, 44);
          c.fillStyle = "#eee";
          c.beginPath();
          c.arc(x, y - 24, 12, Math.PI, 0);
          c.fill();
          c.fillStyle = Math.sin(t * 6) > 0 ? "#ff5252" : "#552";
          c.fillRect(x - 2, y + 10, 4, 4);
          c.strokeStyle = "#35d0ff";
          for (let i = 0; i < 3; i++) {
            const k = (t * 0.8 + i / 3) % 1;
            c.globalAlpha = 1 - k;
            c.beginPath();
            c.arc(x, y + 22, 10 + k * 50, 0.3, 2.8);
            c.stroke();
          }
          c.globalAlpha = 1;
        },
        dock: (c, t) => {
          sky(c, "#040b24", "#15255c", t);
          earth(c, -20, 75, 65);
          const sy = 75 + Math.sin(t * 2.5) * 24;
          c.fillStyle = "#eef5ff";
          c.beginPath();
          c.moveTo(86, sy);
          c.lineTo(62, sy - 9);
          c.lineTo(66, sy);
          c.lineTo(62, sy + 9);
          c.closePath();
          c.fill();
          c.fillStyle = "#35d0ff";
          c.fillRect(54, sy - 2, 8, 4);
          const lx = 90 + ((t * 260) % 190);
          c.fillStyle = "#3ddc84";
          c.fillRect(lx, sy - 1.5, 18, 3);
          [
            [210, 48, 13],
            [245, 95, 16],
            [185, 112, 10],
          ].forEach(([ax, ay, ar], i) => {
            const x = ((ax - t * 40 + 300) % 210) + 95;
            c.fillStyle = "#7a6a58";
            c.strokeStyle = "#ffb13d";
            c.lineWidth = 1.5;
            c.beginPath();
            c.arc(x, ay + Math.sin(t * 2 + i) * 5, ar, 0, 7);
            c.fill();
            c.stroke();
          });
        },
        rover: (c, t) => {
          sky(c, "#071329", "#163b66", t);
          // Canyon spires & floor
          c.fillStyle = "#183654";
          c.fillRect(110, 88, 32, 62);
          c.fillRect(195, 72, 30, 78);
          c.fillStyle = "#26547c";
          c.fillRect(0, 134, 300, 16);
          // Green extraction pad
          c.fillStyle = "#3ddc84";
          c.fillRect(245, 130, 42, 4);
          // Stranded crewmate waving on spire
          c.fillStyle = "#ff9a2e";
          c.fillRect(207, 62, 6, 8);
          c.fillStyle = "#fff";
          c.beginPath();
          c.arc(210, 59, 3, 0, 7);
          c.fill();
          // Hovering jet-pack astronaut
          const ax = 75 + Math.sin(t * 1.4) * 28,
            ay = 56 + Math.cos(t * 2.6) * 14;
          c.fillStyle = "#ffd24a";
          c.beginPath();
          c.arc(ax, ay + 12, 4 + Math.sin(t * 18) * 1.5, 0, 7);
          c.fill();
          c.fillStyle = "#35d0ff";
          c.fillRect(ax - 7, ay - 4, 4, 10);
          c.fillRect(ax + 3, ay - 4, 4, 10);
          c.fillStyle = "#eef5ff";
          c.fillRect(ax - 4, ay - 4, 8, 10);
          c.beginPath();
          c.arc(ax, ay - 8, 4.5, 0, 7);
          c.fill();
          c.fillStyle = "#ffd24a";
          c.fillRect(ax - 2, ay - 9, 5, 2.5);
        },
      };
      function thumbs() {
        const L = [...document.querySelectorAll("canvas[data-p]")];
        if (!L.length) return;
        (function lp(now) {
          if (!document.body.contains(L[0])) return;
          L.forEach(
            (cv) =>
              TH[cv.dataset.p] &&
              TH[cv.dataset.p](cv.getContext("2d"), now / 1000),
          );
          requestAnimationFrame(lp);
        })(performance.now());
      }
      document.addEventListener("pointerdown", bgmStart, { once: true });
      if (S.entered && !S.micAsk)
        document.addEventListener("pointerdown", () => askMicOnce(), {
          once: true,
        });
      home0();
      function home0() {
        go("welcome");
      }
    </script>
  </body>
</html>
